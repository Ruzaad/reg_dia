<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0D3B85">
<link rel="manifest" href="manifest.json">
<title>Samitex — Ingeniería</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
</head>
<body data-pagina="ingenieria">
<header>
  <div class="titulo">INGENIERÍA</div>
  <div class="badges">
    <div class="badge" id="quienBadge"></div>
    <button class="btn-salir" id="btnSalir">Salir</button>
  </div>
</header>
<main>
  <div class="banner-error" id="bannerError"></div>

  <div class="tabs">
    <button class="tab activo" data-tab="pasoEf">EFICIENCIAS</button>
    <button class="tab" data-tab="pasoTk">TICKETS DEL DÍA</button>
    <button class="tab" data-tab="pasoBases">BASES</button>
    <button class="tab" data-tab="pasoAsis">ASISTENCIA</button>
    <button class="tab" data-tab="pasoIncid">INCIDENCIAS</button>
  </div>

  <!-- EFICIENCIAS -->
  <section class="pantalla activa" id="pasoEf">
    <div class="fila-filtros">
      <input type="date" id="fechaEf" onchange="cargarEf()">
      <select id="filtroAreaEf"></select>
    </div>
    <div class="kpis" id="efAreas"></div>
    <div class="contenedor-ancho" style="overflow:auto;max-height:60vh;margin-top:14px;">
      <table class="tabla" id="tablaEf"></table>
    </div>

    <h1 style="margin-top:26px;">Eficiencia día × día</h1>
    <div class="fila-filtros">
      <input type="text" id="rangoEf" placeholder="Selecciona rango de fechas" readonly
             style="min-width:240px;cursor:pointer;">
      <select id="filtroAreaEfR"></select>
      <input type="text" id="filtroNomEfR" placeholder="Buscar por nombre…">
      <button class="btn-mini" onclick="cargarEfRango()">↻ CARGAR</button>
      <button class="btn-mini verde" onclick="descargarEfRango()">DESCARGAR XLSX</button>
    </div>
    <div class="sub" id="resumenEfR"></div>
    <div class="contenedor-ancho" style="overflow:auto;max-height:65vh;">
      <table class="tabla-asis-mes" id="tablaEfR"></table>
    </div>
  </section>

  <!-- TICKETS DEL DÍA -->
  <section class="pantalla" id="pasoTk">
    <div class="fila-filtros">
      <input type="date" id="fechaTk" onchange="cargarTk()">
      <input type="text" id="filtroTk" placeholder="Buscar nombre / OF / artículo / código…">
      <button class="btn-mini" onclick="cargarTk()">↻ CARGAR</button>
      <button class="btn-mini verde" onclick="descargarTk()">DESCARGAR XLSX</button>
    </div>
    <div class="sub" id="resumenTk"></div>
    <div class="kpis" id="resumenUltimas" style="margin-bottom:14px;"></div>
    <div class="contenedor-ancho" style="overflow:auto;max-height:70vh;">
      <table class="tabla" id="tablaTk"></table>
    </div>
  </section>

  <!-- BASES -->
  <section class="pantalla" id="pasoBases">
    <div class="fila-filtros">
      <select id="areaBase" onchange="cargarBases()"></select>
      <input type="text" id="fArt" placeholder="Filtrar artículo…" oninput="pintarBases()">
      <input type="text" id="fOp" placeholder="Filtrar operación…" oninput="pintarBases()">
      <input type="text" id="fCli" placeholder="Filtrar cliente…" oninput="pintarBases()">
      <button class="btn-mini" onclick="cargarBases()">↻ CARGAR</button>
      <button class="btn-mini verde" onclick="descargarBase()">DESCARGAR XLSX</button>
      <label class="btn-mini" style="cursor:pointer;">
        SUBIR EXCEL
        <input type="file" accept=".xlsx,.xls" style="display:none" onchange="leerExcelBase(this)">
      </label>
    </div>
    <div class="sub" id="resumenBases"></div>
    <div class="contenedor-ancho" id="zonaDiff" style="display:none;margin-bottom:14px;"></div>
    <div class="contenedor-ancho" style="overflow:auto;max-height:70vh;">
      <table class="tabla" id="tablaBases"></table>
    </div>
  </section>

  <!-- ASISTENCIA -->
  <section class="pantalla" id="pasoAsis">
    <div class="fila-filtros">
      <input type="month" id="mesAsis" onchange="cargarAsisMes()">
      <select id="filtroAreaAsis"></select>
      <input type="text" id="filtroNomAsis" placeholder="Buscar por nombre…">
      <button class="btn-mini" onclick="abrirModalPersonal(null)">+ AGREGAR PERSONAL</button>
    </div>
    <div class="resumen-estados" id="resumenEstadosAsis"></div>

    <div class="fila-filtros">
      <span class="sub" style="margin:0;">Seleccionadas: <b id="nSelAsis">0</b></span>
      <select id="selArea"></select>
      <button class="btn-mini" onclick="aplicarArea()">CAMBIAR ÁREA</button>
      <button class="btn-mini verde" onclick="abrirModalRango()">ASIGNAR ESTADO POR RANGO</button>
      <button class="btn-mini gris" onclick="limpiarSelAsis()">LIMPIAR SELECCIÓN</button>
    </div>

    <div class="contenedor-ancho">
      <div style="overflow:auto;max-height:65vh;">
        <table class="tabla-asis-mes" id="tablaAsisMes"></table>
      </div>
    </div>
  </section>

  <!-- INCIDENCIAS -->
  <section class="pantalla" id="pasoIncid">
    <button type="button" class="btn-recargar" onclick="cargarIncidI()">↻ RECARGAR</button>
    <div class="lista-cards" id="listaIncidI" style="margin-top:14px;"></div>
  </section>
</main>

<footer class="pie-app">
  <div class="disclaimer">Developed by Lead Developer Adamari Lopez, with support from Analysts Luis Fabian, James Mayta, and Maycool Vega.
    Todos los derechos reservados.</div>
</footer>

<!-- Modal genérico (personal / rango de estados) -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<script src="app.js"></script>
<script src="ingenieria.js"></script>
</body>
</html>
